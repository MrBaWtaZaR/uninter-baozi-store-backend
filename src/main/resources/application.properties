spring.application.name=baozi-store

# O arquivo fica em data, relativa à pasta de execução do projeto.
spring.datasource.url=jdbc:h2:file:./data/baozi-store
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Atualiza as tabelas sem apagar os registros nas reinicializações normais.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Impede que uma quantidade fracionária seja convertida silenciosamente em inteiro.
spring.jackson.deserialization.accept-float-as-int=false

# Console local para consultar o banco durante o estudo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
server.address=127.0.0.1
